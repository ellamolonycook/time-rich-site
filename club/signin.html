<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Theme, applied before first paint so there is no flash of the wrong one.
    // "system" follows the device; the CSS reads this attribute.
    (function () {
      var t = 'system';
      try { t = window.localStorage.getItem('tr_portal_theme') || 'system'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'system';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <!-- Google tag (gtag.js). The library is fetched once the page is
       interactive: it is the heaviest request here and nothing on screen
       waits on it. The consent defaults below are set first, so the queue
       it replays on arrival already respects them. -->
  <script>
    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
    // Consent Mode v2. Region-specific default first, then the global fallback,
    // which is the order Google's docs specify: the narrower region wins.
    gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied',region:['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','GB','CH']});
    gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'granted'});
    gtag('js',new Date());
    gtag('config','G-CTZLQ4R388');

    // The library, once the page has loaded and the main thread is free.
    // requestIdleCallback's own timeout and the setTimeout fallback are both
    // 2000ms, so it never waits longer than that on a busy page.
    (function () {
      var asked = false;
      function loadGtag() {
        if (asked) return;
        asked = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CTZLQ4R388';
        document.head.appendChild(s);
      }
      function schedule() {
        if (typeof window.requestIdleCallback === 'function') {
          window.requestIdleCallback(loadGtag, { timeout: 2000 });
        } else {
          window.setTimeout(loadGtag, 2000);
        }
      }
      if (document.readyState === 'complete') schedule();
      else window.addEventListener('load', schedule);
    })();
  </script>

  <title>Sign in | Time Rich Portal</title>
  <meta property="og:image" content="https://timerich.ai/og-time-rich.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:image" content="https://timerich.ai/og-time-rich.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="portal.css"/>
  <!-- The two faces, served from this repo. They used to come from Google
       Fonts, which costs a DNS lookup, a stylesheet and only then the font
       itself: three round trips before a heading could be drawn in the right
       face, and a reflow when it finally was. Preloading the files directly
       starts them with the stylesheet instead.

       crossorigin is required on a font preload even for a same-origin file:
       fonts are fetched in CORS mode, and a preload without it is fetched
       twice. -->
  <link rel="preload" href="../brand/fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="../brand/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="portal-content.css"/>

  <style>
    /* The sign-in page is one card on a plain page. No blur and no glow:
       both cost a lot on a phone and neither is in the brand. */
    html, body { margin: 0; }
    body {
      font-family: var(--trp-body);
      color: rgb(var(--c-ink));
    }
    *:focus-visible { outline: 2px solid rgb(var(--c-ink)); outline-offset: 2px; }

    /* One underlined field. The padding on the right keeps a long code from
       running under the eye button. */
    .trp-code {
      width: 100%;
      min-height: 44px;
      padding: 12px 44px 12px 0;
      border: 0;
      border-bottom: 1px solid var(--trp-rule);
      border-radius: 0;
      background: transparent;
      color: rgb(var(--c-ink));
      font-family: "Space Grotesk", sans-serif;
      font-size: 16px;      /* under 16px iOS zooms the page in on focus */
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: border-color 0.15s ease;
    }
    .trp-code::placeholder { color: rgb(var(--c-dim)); font-weight: 400; letter-spacing: 0; }
    .trp-code:focus { outline: none; border-bottom-color: rgb(var(--c-ink)); }
    /* Chrome paints an autofilled field a hard blue. */
    .trp-code:-webkit-autofill,
    .trp-code:-webkit-autofill:hover,
    .trp-code:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 30px rgb(var(--c-surface)) inset !important;
      -webkit-text-fill-color: rgb(var(--c-ink)) !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

  </style>

</head>

<body class="min-h-screen flex items-center justify-center px-5 py-10 relative">
  <!-- No portal header on this page, so the theme control sits in the corner.
       Same markup and same wiring as the one in the header elsewhere. -->
  <div class="trp-theme absolute top-4 right-4 sm:top-6 sm:right-6">
    <label class="sr-only" for="theme-signin">Theme</label>
    <select id="theme-signin" data-theme-select>
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <svg class="trp-theme-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
  </div>


  <main class="w-full max-w-[400px]">

    <div class="mb-8 pl-3 sm:pl-4">
      <!-- The wordmark carries the club's full name here, so the kicker that
           used to sit under it would only have said it twice. The stop goes
           after CLUB: it closes the whole name, not the middle of it. -->
      <a href="/" class="trp-wordmark text-[30px] sm:text-[34px] rounded hover:opacity-90 transition-opacity">
        TIME RICH CLUB<span class="trp-stop">.</span>
      </a>
    </div>

    <div class="glass-card is-static px-6 py-8 sm:px-8 sm:py-9">

      <h1 class="text-[30px] sm:text-[34px] font-display font-bold tracking-[-0.03em] leading-[1.05] text-brand-ink">
        Welcome back<span class="trp-stop">.</span>
      </h1>

      <form id="portal-login-form" class="mt-8" data-portal-login novalidate>

        <label for="email" class="trp-tag block">Email address</label>

        <!-- The input deliberately has no name attribute: without one, even a
             stray native submit could not put the address in the URL. -->
        <div class="mt-2">
          <input class="trp-code"
                 id="email"
                 type="email"
                 inputmode="email"
                 autocomplete="email"
                 autocapitalize="off"
                 autocorrect="off"
                 spellcheck="false"
                 aria-describedby="login-error"
                 required/>
        </div>

        <!-- The page's one main action, so it is the pastel fill. It sits
             right under the field, close enough to read as one group. -->
        <button type="submit" class="trp-btn trp-btn-pastel mt-3 w-full active:scale-[0.99]">
          <span id="btn-text">Continue</span>
        </button>

        <!-- The message sits under the button, not between it and the field,
             so the field and the button stay together.
             Two lines are reserved, not one. The card is centred on the page,
             so a message that wraps would grow the card and shift everything
             up by half the extra height. Every message here runs to two lines
             at the widths members use. The input points at this slot with
             aria-describedby, so a screen reader still reads the two together
             even though they are no longer neighbours. -->
        <p id="login-error" data-portal-error role="alert" aria-live="polite"
           class="mt-3 min-h-[2.75rem] text-[14px] leading-[1.35rem] text-brand-error"></p>

      </form>

      <!-- mt-2, not the mt-7 it was: the message slot above now holds two
           lines open under the button, so the breathing room below the form
           is already there and a second helping of it left a hole. -->
      <p class="mt-2 text-[15px] text-brand-ink/70">
        Can't log in?
        <a href="mailto:emc@timerichclub.com" class="text-brand-ink underline underline-offset-2 decoration-brand-ink/25 hover:decoration-brand-ink transition-colors">Contact support</a>
      </p>

    </div>

    <!-- The sponsors, centred under the card. -->
    <p class="mt-6 flex justify-center">
      <!-- The two sponsors, read as one credit: "Powered by" is said once over
           the pair. Stanley is the presenting sponsor, Wispr Flow the official
           voice partner. Both are the real marks in their own colours, at the
           line's own height -- the script that used to swap in a cropped,
           greyed-out Stanley is gone, and so is the bare Wispr tile that read
           as a stray black square with nothing to name it.

           Stanley ships two files because its wordmark is black and vanishes on
           the dark theme; both sit in the markup and the theme picks, since an
           img's src is not something CSS can swap. -->
      <span class="trp-credits">
        <span class="trp-powered-label">Powered by</span>
        <a class="trp-powered" href="https://x.getstanley.ai/r/mz4y9g" target="_blank" rel="noopener sponsored">
          <img class="trp-powered-pos" src="../brand/partners/stanley-logo.png" alt="Stanley" width="765" height="203" loading="lazy" decoding="async"/>
          <img class="trp-powered-rev" src="../brand/partners/stanley-logo-dark.png" alt="Stanley" width="765" height="203" loading="lazy" decoding="async"/>
        </a>
        <span class="trp-credit-dot" aria-hidden="true">&middot;</span>
        <a class="trp-credit" href="https://ref.wisprflow.ai/ella-cook-vt27" target="_blank" rel="noopener sponsored">
          <img class="trp-credit-tile" src="../os/img/wispr-flow.png" alt="" width="256" height="256" loading="lazy" decoding="async"/>
          <span class="trp-credit-name">Wispr Flow</span>
        </a>
      </span>
    </p>

  </main>

  <script>
    // The real check lives in portal-access.js, which owns this form's submit.
    // Everything here only reflects what that check is doing: the button says
    // "Checking", a rejected address puts the button back and returns focus to
    // the field, and an address we know moves on to the curriculum.
    (function () {
      var form = document.getElementById('portal-login-form');
      var label = document.getElementById('btn-text');
      var slot = document.querySelector('[data-portal-error]');
      var input = form && form.querySelector('input');
      var idle = label ? label.textContent : 'Continue';

      if (form) {
        form.addEventListener('submit', function () {
          if (slot) slot.textContent = '';
          if (label) label.textContent = 'Checking…';
        });
      }

      // portal-access.js writes the message into the slot. Watch for it rather
      // than racing its promise, so there is one source of truth for the result.
      if (slot && window.MutationObserver) {
        new MutationObserver(function () {
          if (!slot.textContent.trim()) return;
          if (label) label.textContent = idle;
          if (input) input.focus();
        }).observe(slot, { childList: true, characterData: true, subtree: true });
      }

      // An address we know lands on the curriculum. The dashboard is not
      // offered from here; the Accelerator opens on the curriculum itself.
      document.addEventListener('trportal:data', function () {
        window.location.replace('/club/curriculum');
      });
    })();
  </script>

  <script src="portal-config.js"></script>
  <script src="portal-access.js"></script>


  <!-- The light/dark choice, shared by every portal page. The pre-paint
       script in <head> sets the attribute; this keeps the controls in step
       with it and writes a new choice back. -->
  <script src="portal-theme.js" defer></script>

</body>
</html>
