     The Club home used to be framed at /club, which served the public
     application form to everyone else. The form has its own address now
     (/clubform), /club is the Club home itself, and this page is only here
     for the links already sent: it serves both /club/home and
     /club/home.html.

     The script keeps the query string and the hash, which the refresh below
     cannot. replace() rather than assign, so Back skips this page instead of
     bouncing the member forward again. The refresh is only for a browser
     with scripts off. -->
