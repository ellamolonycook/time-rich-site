<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Rich Club</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://timerich.ai/club/curriculum">
<!-- /portal/curriculum moved to /club/curriculum. GitHub Pages has no server-side redirects, so this
     page does it: it serves both /portal/curriculum and /portal/curriculum.html, which
     is what sits in bookmarks and in the emails already sent.

     The script keeps the query string and the hash, which the refresh below
     cannot: the FAQ links carry a hash. replace() rather than assign, so Back
     skips this page instead of bouncing the member forward again. The refresh
     is only for a browser with scripts off. -->
<script>window.location.replace('/club/curriculum' + window.location.search + window.location.hash);</script>
<meta http-equiv="refresh" content="0; url=/club/curriculum">
</head>
<body>
<p>The Time Rich Club has moved to <a href="/club/curriculum">timerich.ai/club/curriculum</a>.</p>
</body>
</html>
