<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Theme, applied before first paint so there is no flash of the wrong one.
    // "system" follows the device; the CSS reads this attribute.
    (function () {
      var t = 'system';
      try { t = window.localStorage.getItem('tr_portal_theme') || 'system'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'system';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <!-- Google tag (gtag.js). The library is fetched once the page is
       interactive: it is the heaviest request here and nothing on screen
       waits on it. The consent defaults below are set first, so the queue
       it replays on arrival already respects them. -->
  <script>
    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
    // Consent Mode v2. Region-specific default first, then the global fallback,
    // which is the order Google's docs specify: the narrower region wins.
    gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied',region:['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','GB','CH']});
    gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'granted'});
    gtag('js',new Date());
    gtag('config','G-CTZLQ4R388');

    // The library, once the page has loaded and the main thread is free.
    // requestIdleCallback's own timeout and the setTimeout fallback are both
    // 2000ms, so it never waits longer than that on a busy page.
    (function () {
      var asked = false;
      function loadGtag() {
        if (asked) return;
        asked = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CTZLQ4R388';
        document.head.appendChild(s);
      }
      function schedule() {
        if (typeof window.requestIdleCallback === 'function') {
          window.requestIdleCallback(loadGtag, { timeout: 2000 });
        } else {
          window.setTimeout(loadGtag, 2000);
        }
      }
      if (document.readyState === 'complete') schedule();
      else window.addEventListener('load', schedule);
    })();
  </script>

  <title>Sign in | Time Rich Portal</title>

  <link rel="stylesheet" href="portal.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="portal-content.css"/>

  <style>
    /* The sign-in page is one card on a plain page. No blur and no glow:
       both cost a lot on a phone and neither is in the brand. */
    html, body { margin: 0; }
    body {
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      color: rgb(var(--c-ink));
    }
    *:focus-visible { outline: 2px solid rgb(var(--c-ink)); outline-offset: 2px; }

    /* One underlined field. The padding on the right keeps a long code from
       running under the eye button. */
    .trp-code {
      width: 100%;
      padding: 10px 44px 10px 0;
      border: 0;
      border-bottom: 1px solid var(--trp-rule);
      border-radius: 0;
      background: transparent;
      color: rgb(var(--c-ink));
      font-family: "Space Grotesk", sans-serif;
      font-size: 16px;      /* under 16px iOS zooms the page in on focus */
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: border-color 0.15s ease;
    }
    .trp-code::placeholder { color: rgb(var(--c-dim)); font-weight: 400; letter-spacing: 0; }
    .trp-code:focus { outline: none; border-bottom-color: rgb(var(--c-ink)); }
    /* Chrome paints an autofilled field a hard blue. */
    .trp-code:-webkit-autofill,
    .trp-code:-webkit-autofill:hover,
    .trp-code:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 30px rgb(var(--c-surface)) inset !important;
      -webkit-text-fill-color: rgb(var(--c-ink)) !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

</head>

<body class="min-h-screen flex items-center justify-center px-5 py-10 relative">
  <!-- No portal header on this page, so the theme control sits in the corner.
       Same markup and same wiring as the one in the header elsewhere. -->
  <div class="trp-theme absolute top-4 right-4 sm:top-6 sm:right-6">
    <label class="sr-only" for="theme-signin">Theme</label>
    <select id="theme-signin" data-theme-select>
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <svg class="trp-theme-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
  </div>


  <main class="w-full max-w-[400px]">

    <div class="rounded-[24px] border border-brand-ink/10 bg-brand-surface px-6 py-8 sm:px-9 sm:py-10">

      <a href="/" class="inline-flex items-baseline text-[21px] font-display font-bold tracking-tight text-brand-ink rounded">
        Time Rich<span class="text-brand-olive">.</span>
      </a>

      <p class="mt-7 text-[10px] font-mono font-medium uppercase tracking-[0.18em] text-brand-ink/70">
        Superhuman Accelerator
      </p>
      <h1 class="mt-2 text-[28px] font-display font-bold tracking-tight text-brand-ink">
        Welcome back
      </h1>

      <form id="portal-login-form" class="mt-8" data-portal-login novalidate>

        <label for="email" class="block text-[11px] font-medium uppercase tracking-[0.12em] text-brand-ink/70">
          Email address
        </label>

        <!-- The input deliberately has no name attribute: without one, even a
             stray native submit could not put the address in the URL. -->
        <div class="mt-1.5">
          <input class="trp-code"
                 id="email"
                 type="email"
                 inputmode="email"
                 autocomplete="email"
                 autocapitalize="off"
                 autocorrect="off"
                 spellcheck="false"
                 required
                 placeholder="you@example.com"/>
        </div>

        <!-- Two lines are reserved, not one. The card is centred on the page,
             so a message that wraps would grow the card and shift everything
             up by half the extra height. Every message here runs to two lines
             at the widths members use. -->
        <p data-portal-error role="alert" aria-live="polite"
           class="mt-3 min-h-[2.5rem] text-[13px] leading-[1.25rem] text-brand-error"></p>

        <button type="submit"
                class="mt-5 w-full rounded-full bg-brand-ink px-6 py-3.5 text-[13px] font-semibold tracking-[0.02em] text-brand-page hover:bg-brand-ink/90 active:scale-[0.99] transition-all">
          <span id="btn-text">Continue</span>
        </button>

      </form>

      <p class="mt-7 text-[13px] text-brand-ink/70">
        Not sure which email?
        <a href="mailto:emc@timerich.ai" class="text-brand-ink underline underline-offset-2 decoration-brand-ink/25 hover:decoration-brand-ink transition-colors">Email emc@timerich.ai</a>
      </p>

    </div>

  </main>

  <script>
    // The real check lives in portal-access.js, which owns this form's submit.
    // Everything here only reflects what that check is doing: the button says
    // "Checking", a rejected address puts the button back and returns focus to
    // the field, and an address we know moves on to the dashboard.
    (function () {
      var form = document.getElementById('portal-login-form');
      var label = document.getElementById('btn-text');
      var slot = document.querySelector('[data-portal-error]');
      var input = form && form.querySelector('input');
      var idle = label ? label.textContent : 'Continue';

      if (form) {
        form.addEventListener('submit', function () {
          if (slot) slot.textContent = '';
          if (label) label.textContent = 'Checking…';
        });
      }

      // portal-access.js writes the message into the slot. Watch for it rather
      // than racing its promise, so there is one source of truth for the result.
      if (slot && window.MutationObserver) {
        new MutationObserver(function () {
          if (!slot.textContent.trim()) return;
          if (label) label.textContent = idle;
          if (input) input.focus();
        }).observe(slot, { childList: true, characterData: true, subtree: true });
      }

      // An address we know lands on the dashboard.
      document.addEventListener('trportal:data', function () {
        window.location.replace('dashboard.html');
      });
    })();
  </script>

  <script src="portal-config.js"></script>
  <script src="portal-access.js"></script>

  <script>
    // === SMOOTH PAGE TRANSITIONS ===
    // Internal .html links fade the page out before navigating. The fade is
    // decoration; the navigation is the job, so every path below ends in a
    // navigation even when the animation never runs or is cut short.
    (function () {
      var FADE_MS = 150;

      var reduced = false;
      try {
        reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      } catch (e) { /* no matchMedia: treat as no preference */ }

      // Coming back via the Back button can restore this page from the bfcache
      // with the fade still applied, which shows a blank screen.
      //
      // Only this script's own fade is undone. Every portal page sets its own
      // entrance transform inline on <body>, so clearing that unconditionally
      // would kill the page's open animation on a normal load.
      var LEAVING = 'data-trp-leaving';
      window.addEventListener('pageshow', function () {
        if (!document.body.hasAttribute(LEAVING)) return;
        document.body.removeAttribute(LEAVING);
        document.body.style.opacity = '';
        document.body.style.transform = '';
      });

      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('a[href]').forEach(function (link) {
          var href = link.getAttribute('href');
          if (!href) return;
          if (href.indexOf('http') === 0 || href.charAt(0) === '#' || href.indexOf('mailto') === 0) return;
          if (href.slice(-5) !== '.html') return;
          // A link meant for another tab keeps its default behaviour.
          if (link.target && link.target !== '_self') return;

          link.addEventListener('click', function (e) {
            // Cmd/Ctrl/Shift/Alt click and middle click open a new tab.
            // Hijacking those would quietly break them.
            if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

            e.preventDefault();

            // Anyone who asked for less motion simply goes.
            if (reduced) { window.location.href = href; return; }

            var done = false;
            function go() {
              if (done) return;
              done = true;
              window.location.href = href;
            }

            try {
              document.body.setAttribute(LEAVING, '');
              document.body.style.opacity = '0';
              document.body.style.transform = 'scale(0.98)';
              // Whichever comes first wins.
              document.body.addEventListener('transitionend', go, { once: true });
            } catch (err) {
              go();                 // styling failed, so just navigate
              return;
            }

            setTimeout(go, FADE_MS);
            // A short backstop: transitionend does not fire in a backgrounded
            // tab, and a click must never end on a page left faded out.
            setTimeout(go, FADE_MS + 250);
          });
        });
      });
    })();
  </script>

  <script>
    // Keeps every theme control on the page in step with what was stored,
    // and writes the choice back. The attribute itself is set in <head>.
    (function () {
      var KEY = 'tr_portal_theme';
      var selects = document.querySelectorAll('[data-theme-select]');
      if (!selects.length) return;

      var current = document.documentElement.getAttribute('data-theme') || 'system';
      Array.prototype.forEach.call(selects, function (sel) {
        sel.value = current;
        sel.addEventListener('change', function () {
          var value = sel.value === 'light' || sel.value === 'dark' ? sel.value : 'system';
          document.documentElement.setAttribute('data-theme', value);
          try { window.localStorage.setItem(KEY, value); } catch (e) { /* choice lasts the session */ }
          Array.prototype.forEach.call(selects, function (other) { other.value = value; });
        });
      });
    })();
  </script>

</body>
</html>
