<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Time Rich — AI Education Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            offwhite: '#FFFDFB',
            sage: '#D9DEBE',
            green: '#424B36',
            deep: '#111827',
            mid: '#4B5563',
          }
        },
        fontFamily: {
          sans: ['"Inter"', 'sans-serif'],
          display: ['"Space Grotesk"', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  h1, h2, h3, h4, h5, h6 { font-family: "Space Grotesk", sans-serif; letter-spacing: -0.022em; }
</style>
</head>
<body class="bg-white text-brand-deep min-h-screen relative font-sans selection:bg-brand-sage selection:text-brand-deep flex flex-col">

<!-- Top Banner (Optional match to accelerator) -->
<div class="w-full bg-brand-green text-white text-[13px] font-medium py-2.5 px-4 text-center tracking-wide">
  AI EDUCATION PORTAL
</div>

<!-- Header -->
<header class="w-full border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-6 sm:px-12 flex items-center justify-between h-20">
    <a class="text-[22px] font-bold tracking-tight text-brand-deep focus:outline-none" href="#">
      Time Rich.
    </a>
    <div class="hidden sm:flex items-center gap-8 text-sm font-medium text-gray-500">
      <span class="hover:text-brand-deep transition-colors cursor-pointer">Learn</span>
      <span class="hover:text-brand-deep transition-colors cursor-pointer">Build</span>
      <span class="hover:text-brand-deep transition-colors cursor-pointer">Grow</span>
    </div>
  </div>
</header>

<!-- Main Login Section -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-12">
  
  <div class="w-full max-w-[480px]">
    
    <div class="text-center mb-10">
      <h1 class="text-4xl sm:text-5xl font-display font-bold text-brand-deep tracking-tight">Access Portal</h1>
    </div>
    
    <div class="bg-brand-sage rounded-[20px] p-8 sm:p-12 shadow-sm relative overflow-hidden">
      <!-- Decorative plus icons from the screenshot -->
      <div class="absolute top-6 right-6 w-5 h-5 rounded-full border border-brand-green/20 flex items-center justify-center text-brand-green text-xs font-bold">+</div>
      
      <p class="text-base text-brand-green/80 font-medium mb-8">Enter your access code to continue to the education dashboard.</p>
      
      <form id="portal-login-form" class="space-y-6">
        <div class="space-y-2">
          <div class="relative">
            <input class="block w-full px-5 py-4 bg-white/50 focus:bg-white text-brand-deep placeholder:text-brand-green/60 border border-brand-green/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-green/30 focus:border-brand-green/40 shadow-sm transition-all text-lg font-medium" id="password" name="password" placeholder="Access code" required="" type="password" value="timerich2026"/>
          </div>
        </div>
        <button id="unlock-btn" class="w-full py-4 px-4 bg-brand-deep hover:bg-black active:scale-[0.99] text-white text-base font-medium rounded-xl flex items-center justify-center gap-2 transition-all duration-300 group" type="submit">
          <span id="btn-text">Enter Portal</span>
          <i id="btn-icon" class="w-4 h-4 stroke-[2] group-hover:translate-x-1 transition-transform" data-lucide="arrow-right"></i>
        </button>
      </form>
    </div>

  </div>

</main>

<!-- Bottom sticky bar match -->
<div class="w-full bg-brand-green text-white py-4 px-6 flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-8 mt-auto">
  <span class="text-xs font-bold tracking-widest uppercase text-white/90">FOUNDING COHORT • LIMITED SPOTS</span>
</div>

<script>
  lucide.createIcons();
  
  document.addEventListener('DOMContentLoaded', () => {
    const loginForm = document.getElementById('portal-login-form');
    const unlockBtn = document.getElementById('unlock-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('btn-icon');
    
    window.addEventListener('pageshow', (event) => {
      if (event.persisted && unlockBtn) {
        document.body.style.transition = 'none';
        document.body.style.opacity = '1';
        unlockBtn.classList.remove('opacity-90', 'pointer-events-none');
        btnText.innerHTML = 'Enter Portal';
        btnIcon.style.display = 'inline-block';
      }
    });

    if (loginForm && unlockBtn) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        unlockBtn.classList.add('opacity-90', 'pointer-events-none');
        btnText.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
        btnIcon.style.display = 'none';
        
        setTimeout(() => {
          btnText.innerHTML = `Access Granted`;
          btnIcon.style.display = 'none';
          
          setTimeout(() => {
            document.body.style.transition = 'opacity 0.8s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 800);
          }, 600);
        }, 800);
      });
    }
  });
</script>
</body>
</html>
