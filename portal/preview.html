<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CTZLQ4R388"></script>
  <script>
    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
    // Consent Mode v2. Region-specific default first, then the global fallback,
    // which is the order Google's docs specify: the narrower region wins.
    gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied',region:['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','GB','CH']});
    gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'granted'});
    gtag('js',new Date());
    gtag('config','G-CTZLQ4R388');
  </script>

  <meta name="robots" content="noindex, nofollow"/>
  <title>Portal preview — Time Rich</title>

  <!-- portal-access.js renders the week and session markup with Tailwind
       utility classes, the same as every other portal page. Without this the
       injected content is unstyled: the SVG icons have no w-/h- size and fill
       their container, and links fall back to the browser default blue.
       The forms plugin is left off here, unlike the other portal pages: this
       is the only page with a .trp-input, and the plugin's [type='text']
       rules would override its radius, padding and colours. -->
  <script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FFFCEB',
              offwhite: '#FFFDFB',
              sage: '#DCDEBF',
              sagelt: '#E9EAD5',
              green: '#424B36',
              deep: '#333A28',
              mid: '#4E5840',
              lime: '#CCEEA0',
              olive: '#67762E'
            }
          },
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            serif: ['"Newsreader"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"/>

  <link rel="stylesheet" href="portal-content.css"/>

  <style>
    /* Page chrome only. Everything inside the portal sections is styled
       by portal-content.css. */
    html, body { margin: 0; background: #FFFCEB; }
    body { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
    .pv-note {
      max-width: 48rem;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(66, 75, 54, 0.12);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(78, 88, 64, 0.8);
    }
    .pv-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
  
    /* === SMOOTH PORTAL TRANSITIONS === */
    html { scroll-behavior: smooth; }
    
    /* Smooth all interactive elements */
    a, button, [role="button"] {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    /* Smooth focus states */
    *:focus-visible {
      outline: 2px solid rgba(89, 108, 36, 0.4);
      outline-offset: 2px;
      transition: outline 0.2s ease;
    }
    
    /* Smooth image loading */
    img {
      transition: opacity 0.4s ease;
    }
    
    /* Accordion smooth expand/collapse */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.4s ease, 
                  padding 0.4s ease;
      opacity: 0;
    }
    .accordion-content.open {
      opacity: 1;
    }
    
  
    /* Smooth press feedback on cards */
    .glass-card:active {
      transform: translateY(-1px) scale(0.995);
      transition: transform 0.15s ease;
    }
    
  
    /* === MOBILE PERFORMANCE === */
    @media (max-width: 768px) {
      /* Reduce blur intensity on mobile for performance */
      .glass-card,
      .premium-dropdown {
        -webkit-backdrop-filter: blur(16px) !important;
        backdrop-filter: blur(16px) !important;
      }
      .glass3d::before {
        -webkit-backdrop-filter: blur(8px) brightness(0.8) !important;
        backdrop-filter: blur(8px) brightness(0.8) !important;
      }
      /* Disable noise overlay on mobile */
      .noise-overlay {
        display: none !important;
      }
      /* Disable shimmer hover on touch devices */
      .shimmer-card::before {
        display: none !important;
      }
      /* Reduce box-shadow complexity */
      .glass3d {
        box-shadow: 0 2px 8px rgba(0,0,0,0.1) !important;
      }
      /* Reduce floating animations */
      .animate-float, .animate-float-alt {
        animation: none !important;
      }
      /* Faster page transitions on mobile */
      body {
        transition: opacity 0.4s ease, transform 0.4s ease !important;
      }
      /* Disable grid lines on mobile for performance */
      .main-grid {
        background-image: none !important;
      }
    }
    
    /* Respect reduced motion preferences */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    
    /* Touch device optimizations */
    @media (hover: none) {
      .card-lift:hover {
        transform: none;
        box-shadow: none;
      }
      .shimmer-card::before {
        display: none;
      }
    }
    
  </style>

  <!-- Config first, then the library. Both are deferred so the DOM is
       ready before the script mounts. -->
  <script src="portal-config.js" defer></script>
  <script src="portal-access.js" defer></script>
</head>

<body>

  <p class="pv-note">Preview page &middot; not indexed &middot; not linked from the portal</p>

  <main class="trp-wrap">

    <noscript>
      <p class="trp-error">This page needs JavaScript to show your portal content.</p>
    </noscript>

    <!-- Shown only while the stored code is being checked. -->
    <div class="trp-when-loading">
      <p class="trp-empty">Checking your access&hellip;</p>
    </div>

    <!-- Shown when there is no valid code. -->
    <div class="trp-when-out">
      <form class="trp-login" data-portal-login novalidate>
        <p class="trp-eyebrow">Accelerator portal</p>
        <h1 class="trp-h1">Enter your code</h1>

        <!-- The input deliberately has no name attribute, so even a stray
             native submit could never put the passcode in the URL. -->
        <label class="trp-label" for="tr-code">Access code</label>
        <input class="trp-input"
               id="tr-code"
               type="text"
               inputmode="text"
               autocomplete="one-time-code"
               autocapitalize="characters"
               autocorrect="off"
               spellcheck="false"
               placeholder="XXXXX-XXXXX"/>

        <button class="trp-btn" type="submit">Unlock</button>

        <p class="trp-error" data-portal-error role="alert"></p>
        <p class="trp-hint">Your code was sent with your order confirmation.</p>
      </form>
    </div>

    <!-- Shown only once a valid code has loaded. -->
    <div class="trp-when-in">

      <div class="pv-bar">
        <h1 class="trp-h1" style="margin: 0;">Welcome<span class="trp-name" data-portal-name></span></h1>
        <button class="trp-btn trp-btn-quiet" type="button" data-portal-signout>Sign out</button>
      </div>

      <section class="trp-section">
        <p class="trp-eyebrow">Your weeks</p>
        <h2 class="trp-h2">Course content</h2>
        <div data-portal-weeks></div>
      </section>

      <section class="trp-section">
        <p class="trp-eyebrow">Live calls</p>
        <h2 class="trp-h2">Sessions</h2>
        <div data-portal-sessions></div>
      </section>

    </div>

  </main>


  <script>
    // === SMOOTH PAGE TRANSITIONS ===
    // Intercept all internal nav links for smooth exit
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('a[href]').forEach(link => {
        const href = link.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto') && href.endsWith('.html')) {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            document.body.style.opacity = '0';
            document.body.style.transform = 'scale(0.98)';
            setTimeout(() => { window.location.href = href; }, window.innerWidth < 768 ? 120 : 280);
          });
        } origin/main
      });

      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('a[href]').forEach(function (link) {
          var href = link.getAttribute('href');
          if (!href) return;
          if (href.indexOf('http') === 0 || href.charAt(0) === '#' || href.indexOf('mailto') === 0) return;
          if (href.slice(-5) !== '.html') return;
          // A link meant for another tab keeps its default behaviour.
          if (link.target && link.target !== '_self') return;

          link.addEventListener('click', function (e) {
            // Cmd/Ctrl/Shift/Alt click and middle click open a new tab.
            // Hijacking those would quietly break them.
            if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

            e.preventDefault();

            // Anyone who asked for less motion simply goes.
            if (reduced) { window.location.href = href; return; }

            var done = false;
            function go() {
              if (done) return;
              done = true;
              window.location.href = href;
            }

            try {
              document.body.setAttribute(LEAVING, '');
              document.body.style.opacity = '0';
              document.body.style.transform = 'scale(0.98)';
              // Whichever comes first wins.
              document.body.addEventListener('transitionend', go, { once: true });
            } catch (err) {
              go();                 // styling failed, so just navigate
              return;
            }

            setTimeout(go, FADE_MS);
            // Last resort. transitionend never fires in a backgrounded tab and
            // timers there are throttled, so this guarantees a click can never
            // end on a page left sitting faded out.
            setTimeout(go, FADE_MS + 1200);
          });
        });
      });
    })();
  </script>

</body>
</html>
