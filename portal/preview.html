<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <script>
    // Theme, applied before first paint so there is no flash of the wrong one.
    // "system" follows the device; the CSS reads this attribute.
    (function () {
      var t = 'system';
      try { t = window.localStorage.getItem('tr_portal_theme') || 'system'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = 'system';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Google tag (gtag.js). The library is fetched once the page is
       interactive: it is the heaviest request here and nothing on screen
       waits on it. The consent defaults below are set first, so the queue
       it replays on arrival already respects them. -->
  <script>
    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
    // Consent Mode v2. Region-specific default first, then the global fallback,
    // which is the order Google's docs specify: the narrower region wins.
    gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied',region:['AT','BE','BG','HR','CY','CZ','DK','EE','FI','FR','DE','GR','HU','IS','IE','IT','LV','LI','LT','LU','MT','NL','NO','PL','PT','RO','SK','SI','ES','SE','GB','CH']});
    gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'granted'});
    gtag('js',new Date());
    gtag('config','G-CTZLQ4R388');

    // The library, once the page has loaded and the main thread is free.
    // requestIdleCallback's own timeout and the setTimeout fallback are both
    // 2000ms, so it never waits longer than that on a busy page.
    (function () {
      var asked = false;
      function loadGtag() {
        if (asked) return;
        asked = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-CTZLQ4R388';
        document.head.appendChild(s);
      }
      function schedule() {
        if (typeof window.requestIdleCallback === 'function') {
          window.requestIdleCallback(loadGtag, { timeout: 2000 });
        } else {
          window.setTimeout(loadGtag, 2000);
        }
      }
      if (document.readyState === 'complete') schedule();
      else window.addEventListener('load', schedule);
    })();
  </script>

  <meta name="robots" content="noindex, nofollow"/>
  <title>Portal preview — Time Rich</title>

  <!-- portal-access.js renders the week and session markup with Tailwind
       utility classes, the same as every other portal page. Without this the
       injected content is unstyled: the SVG icons have no w-/h- size and fill
       their container, and links fall back to the browser default blue.
       The forms plugin is left off here, unlike the other portal pages: this
       is the only page with a .trp-input, and the plugin's [type='text']
       rules would override its radius, padding and colours. -->

  <link rel="stylesheet" href="portal.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;display=swap"/>

  <link rel="stylesheet" href="portal-content.css"/>

  <style>
    /* Page chrome only. Everything inside the portal sections is styled
       by portal-content.css. */
    html, body { margin: 0; }
    body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; }
    .pv-note {
      max-width: 48rem;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(66, 75, 54, 0.12);
      font-family: "Space Mono", ui-monospace, monospace;
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(78, 88, 64, 0.8);
    }
    .pv-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
  
    /* Hover and focus only, at the portal's 150ms. The blur, shadow and
       float rules that used to live here are gone with the effects they
       targeted. */
    a, button, [role="button"] { transition: color .15s ease, background-color .15s ease, border-color .15s ease; }
    *:focus-visible { outline: 2px solid #424B36; outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

  <!-- Config first, then the library. Both are deferred so the DOM is
       ready before the script mounts. -->
  <script src="portal-config.js" defer></script>
  <script src="portal-access.js" defer></script>
</head>

<body>

  <p class="pv-note">Preview page &middot; not indexed &middot; not linked from the portal</p>

  <main class="trp-wrap">

    <noscript>
      <p class="trp-error">This page needs JavaScript to show your portal content.</p>
    </noscript>

    <!-- Shown only while the stored code is being checked. -->
    <div class="trp-when-loading">
      <p class="trp-empty">Checking your access&hellip;</p>
    </div>

    <!-- Shown when there is no valid code. -->
    <div class="trp-when-out">
      <form class="trp-login" data-portal-login novalidate>
        <p class="trp-kicker">Accelerator portal</p>
        <h1 class="trp-h1">Sign in</h1>

        <!-- The input deliberately has no name attribute, so even a stray
             native submit could never put the address in the URL. -->
        <label class="trp-tag" for="tr-email">Email address</label>
        <input class="trp-input"
               id="tr-email"
               type="email"
               inputmode="email"
               autocomplete="email"
               autocapitalize="off"
               autocorrect="off"
               spellcheck="false"
               placeholder="you@example.com"/>

        <button class="trp-btn" type="submit">Continue</button>

        <p class="trp-error" data-portal-error role="alert"></p>
        <p class="trp-hint">Use the email address you joined with.</p>
      </form>
    </div>

    <!-- Shown only once a valid code has loaded. -->
    <div class="trp-when-in">

      <div class="pv-bar">
        <h1 class="trp-h1" style="margin: 0;">Welcome<span class="trp-name" data-portal-name></span></h1>
        <button class="trp-btn trp-btn-quiet" type="button" data-portal-signout>Sign out</button>
      </div>

      <section class="trp-section">
        <p class="trp-kicker">Your weeks</p>
        <h2 class="trp-h2">Course content</h2>
        <div data-portal-weeks></div>
      </section>

      <section class="trp-section">
        <p class="trp-kicker">Live calls</p>
        <h2 class="trp-h2">Sessions</h2>
        <div data-portal-sessions></div>
      </section>

    </div>

  </main>


  <script>
    // === SMOOTH PAGE TRANSITIONS ===
    // Internal .html links fade the page out before navigating. The fade is
    // decoration; the navigation is the job, so every path below ends in a
    // navigation even when the animation never runs or is cut short.
    (function () {
      var FADE_MS = 150;

      var reduced = false;
      try {
        reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      } catch (e) { /* no matchMedia: treat as no preference */ }

      // Coming back via the Back button can restore this page from the bfcache
      // with the fade still applied, which shows a blank screen.
      //
      // Only this script's own fade is undone. Every portal page sets its own
      // entrance transform inline on <body>, so clearing that unconditionally
      // would kill the page's open animation on a normal load.
      var LEAVING = 'data-trp-leaving';
      window.addEventListener('pageshow', function () {
        if (!document.body.hasAttribute(LEAVING)) return;
        document.body.removeAttribute(LEAVING);
        document.body.style.opacity = '';
        document.body.style.transform = '';
      });

      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('a[href]').forEach(function (link) {
          var href = link.getAttribute('href');
          if (!href) return;
          if (href.indexOf('http') === 0 || href.charAt(0) === '#' || href.indexOf('mailto') === 0) return;
          if (href.slice(-5) !== '.html') return;
          // A link meant for another tab keeps its default behaviour.
          if (link.target && link.target !== '_self') return;

          link.addEventListener('click', function (e) {
            // Cmd/Ctrl/Shift/Alt click and middle click open a new tab.
            // Hijacking those would quietly break them.
            if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

            e.preventDefault();

            // Anyone who asked for less motion simply goes.
            if (reduced) { window.location.href = href; return; }

            var done = false;
            function go() {
              if (done) return;
              done = true;
              window.location.href = href;
            }

            try {
              document.body.setAttribute(LEAVING, '');
              document.body.style.opacity = '0';
              document.body.style.transform = 'scale(0.98)';
              // Whichever comes first wins.
              document.body.addEventListener('transitionend', go, { once: true });
            } catch (err) {
              go();                 // styling failed, so just navigate
              return;
            }

            setTimeout(go, FADE_MS);
            // A short backstop: transitionend does not fire in a backgrounded
            // tab, and a click must never end on a page left faded out.
            setTimeout(go, FADE_MS + 250);
          });
        });
      });
    })();
  </script>

</body>
</html>
