<!-- /join/ was the three-question page in front of the ThriveCart checkout.
     Cohort 2 is a waitlist (Ella, 10 Nov), so there is no checkout to stand in
     front of and this page sends everybody to the form on the accelerator page
     instead. GitHub Pages has no server-side redirects, so the page does it.

     It keeps the query string, which the refresh below cannot: the affiliate
     tag rides in on one. The hash is replaced rather than kept, because the
     whole point of the address is to land on the waitlist form. replace()
     rather than assign, so Back skips this page instead of bouncing somebody
     forward again. The refresh is only for a browser with scripts off.

     noindex because this is now a doorway: the accelerator page is the one
     that should rank, and it is the canonical above. -->
<script>window.location.replace('/accelerator/' + window.location.search + '#waitlist');</script>
<meta http-equiv="refresh" content="0; url=/accelerator/#waitlist">
</head>
<body>
<p>The Superhuman Accelerator waitlist has moved to <a href="/accelerator/#waitlist">timerich.ai/accelerator</a>.</p>
