# Cloudflare Worker that receives Time Rich applications and writes them to Notion.
#
# Deploy:
#   cd worker
#   npx wrangler deploy
#
# Set your secrets (these are NOT stored in this file):
#   npx wrangler secret put NOTION_TOKEN          # your Notion integration token
#   npx wrangler secret put NOTION_DATABASE_ID    # the applications database id
#   npx wrangler secret put ANTHROPIC_API_KEY     # powers the corner chatbot (the brain)
#   npx wrangler secret put CAL_WEBHOOK_SECRET    # the secret you set on the Cal.com webhook
#   npx wrangler secret put SLACK_BOT_TOKEN       # xoxb-... with chat:write, for booking alerts
#   npx wrangler secret put SLACK_CHANNEL_ID      # e.g. C0123ABCD — invite the bot to it first
#   npx wrangler secret put SLACK_WEBHOOK_URL     # incoming webhook for /qualify submission alerts
#   npx wrangler secret put SLACK_QUESTIONNAIRE_WEBHOOK_URL  # questionnaire alerts and failed member photos
#   npx wrangler secret put SUPABASE_URL          # portal project URL, for /portal-download and Time Rich Members
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY  # service role key, Worker only, never in the browser
#   npx wrangler secret put DIRECTORY_SYNC_SECRET # guards POST /portal-directory-sync (the Members backfill)
#
# After deploy, wrangler prints a URL like:
#   https://time-rich-forms.<your-subdomain>.workers.dev
# Paste that into FORM_ENDPOINT in index.html (the application form),
# and set the coaching form's action to <that URL>/coaching
# (in "17 — AI Coaching Intake.html", replace [WORKER_URL] with that base URL).

name = "time-rich-forms"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Per-IP rate limit on POST /portal-login (10 attempts per 10 minutes).
#
# Create the namespace once, then paste the id it prints in here:
#
#   cd worker
#   npx wrangler kv namespace create PORTAL_LOGIN_RL
#
# Until the id is filled in and deployed, the login route still works but
# IS NOT RATE LIMITED: the Worker treats a missing binding as "allow".
# [[kv_namespaces]]
binding = "PORTAL_LOGIN_RL"
id = "a4db5f2916e0496f8851947b5a043e7a"

[vars]
# Locked to the live domain so only timerich.ai can submit the application form.
# Use "*" only when testing locally.
ALLOWED_ORIGIN = "https://timerich.ai,https://www.timerich.ai"

# AI Revenue Accelerator application (POST /accelerator) -> its own Notion database.
# Same NOTION_TOKEN integration must be connected to this database too.
NOTION_ACCELERATOR_DATABASE_ID = "fd7e0a3f-2d74-4104-ab08-0f438260d487"

# 1:1 AI OS Coaching intake form (POST /coaching) -> its own Notion database.
# Id is from the database URL. IMPORTANT: connect the SAME Notion integration
# (NOTION_TOKEN) to this database too (••• -> Connections), or writes will 404.
NOTION_COACHING_DATABASE_ID = "f4f0b1c4-1b81-463c-8ff3-3e625aaf847a"

# Super Human Accelerator application (POST /superhuman) -> its own Notion database.
# Id is from the database URL (9b7ca5ebe55782f8894a0126ecc4ddf2).
# IMPORTANT: connect the SAME Notion integration (NOTION_TOKEN) to this database
# (••• -> Connections) or writes will 404.
NOTION_SUPERHUMAN_DATABASE_ID = "9b7ca5eb-e557-82f8-894a-0126ecc4ddf2"

# Super Human Accelerator waitlist (POST /waitlist) -> its own Notion database.
# Id is from the database URL (2db1e956f2bd4b14bad0aa00c0ea3e75).
# IMPORTANT: connect the SAME Notion integration (NOTION_TOKEN) to this database
# (••• -> Connections) or writes will 404.
NOTION_WAITLIST_DATABASE_ID = "2db1e956-f2bd-4b14-bad0-aa00c0ea3e75"

# Cal.com booking webhook (POST /cal-webhook) -> updates the Super Human
# application row above (Status / Call time) and posts the breakdown to Slack.
# In Cal: Settings -> Webhooks -> new webhook pointed at <worker URL>/cal-webhook,
# subscribed to BOOKING_CREATED, BOOKING_RESCHEDULED and BOOKING_CANCELLED, with
# a secret that matches CAL_WEBHOOK_SECRET. Cal signs the raw body with it
# (HMAC-SHA256, hex) in the x-cal-signature-256 header; unsigned deliveries are
# rejected 401. No new database id is needed — it reuses the one above.

# Qualify form (POST /qualify) -> its own Notion database.
# Id is from the database URL (bdd8e0c354da404a8ceba7139e18c65e).
# IMPORTANT: connect the SAME Notion integration (NOTION_TOKEN) to this database
# (••• -> Connections) or writes will 404.
NOTION_QUALIFY_DATABASE_ID = "bdd8e0c3-54da-404a-8ceb-a7139e18c65e"

# Strategy intake (POST /strategy) -> the "Client Intake Form" database.
# Id is from the database URL (294ef74510524e5aa53f532eea0b435e).
# IMPORTANT: this one lives at the top level of the private workspace, so it is
# NOT shared with anything by default. Connect the SAME Notion integration
# (NOTION_TOKEN) to it (open the database -> ••• -> Connections) or writes 404.
NOTION_STRATEGY_DATABASE_ID = "294ef745-1052-4e5a-a53f-532eea0b435e"

# Superhuman Accelerator Cohort 1 checkout/onboarding
# Uses the existing NOTION_TOKEN / TR Site integration.
NOTION_SUPERHUMAN_COHORT1_DATABASE_ID = "3e3ca5eb-e557-80ab-9b32-e3c84d74784e"
# Required Worker secrets: THRIVECART_SECRET and WHATSAPP_INVITE_URL.

# Superhuman questionnaire (POST /superhuman-questionnaire) -> its own Notion
# database. The page at /superhuman/ is open to buyers, second seats and
# ambassadors alike, so there is no order lookup: Name, Email and Role come
# straight off the form, and the email is the key the handler updates on.
# IMPORTANT: connect the SAME Notion integration (NOTION_TOKEN) to this
# database (••• -> Connections) or writes will 404.
NOTION_SUPERHUMAN_QUESTIONNAIRE_DATABASE_ID = "a4b3fdd6-c528-47a8-8ff6-ab27924b2862"

# Time Rich Members (portal member directory). No new vars: it uses the
# questionnaire database above plus SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# SLACK_QUESTIONNAIRE_WEBHOOK_URL and DIRECTORY_SYNC_SECRET (secrets, see top).
#   - Every saved questionnaire is copied into portal_directory, with the photo.
#   - POST /portal-directory is the read route the portal page calls.
#   - Backfill once after the migration and deploy:
#       curl -X POST https://time-rich-forms.timerich.workers.dev/portal-directory-sync \
#            -H "Authorization: Bearer <DIRECTORY_SYNC_SECRET>"
#   - Launch (Mon 2 Nov) is a database switch, not a deploy:
#       update portal_settings set value = 'true' where key = 'directory_enabled';
